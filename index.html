<!doctype html>
<html lang="en">

  <a class="skip-link" href="#content">Skip to content</a>

    <a class="brand" href="#dashboard" aria-label="Azzurro Workspace home"><span><b>Azzurro</b><small>WORKSPACE</small></span></a>
    <div class="workspace"><span class="workspace-mark" aria-hidden="true">AW</span><div>Azzurro Workspace<small>People. Projects. Progress.</small></div></div>
    <p class="nav-label">Workspace</p>
    <nav aria-label="Main">
      <button data-view="dashboard"><span data-nav-icon="dashboard"></span> Dashboard</button>
      <button data-view="recurring"><span data-nav-icon="repeat"></span> Recurring tasks<span class="routine-nav-count" id="routine-nav-count" hidden></span></button>
      <button data-view="board"><span data-nav-icon="board"></span> Operations</button>
      <button data-view="maintenance"><span data-nav-icon="tools"></span> Onsite Maintenance</button>
      <button data-view="availability"><span data-nav-icon="sheet"></span> Rooms &amp; bathrooms</button>
      <button data-view="trackers"><span data-nav-icon="folder"></span> Trackers</button>
      <button data-view="purchases"><span data-nav-icon="cart"></span> Purchase List</button>
      <button data-view="members"><span data-nav-icon="people"></span> Team members</button>
      <button data-view="users" hidden><span data-nav-icon="users"></span> Users</button>
    </nav>
    <div class="aside-bottom"><span class="paper-stamp">Azzurro Hotels</span><b>Good work.<br>One day at a time.</b><small>Team workspace · Sydney time</small></div>
  </aside>

    <header>
      <div class="header-left"><div id="sidebar-reopen" hidden></div><div class="breadcrumb">Workspace <span aria-hidden="true">/</span> <b id="breadcrumb">Dashboard</b></div></div>
      <div class="header-right"><span id="date"></span><div id="visitor-bar"></div></div>
    </header>
    <section id="content" tabindex="-1" aria-label="Workspace content"></section>
    <footer><span>Azzurro Workspace</span><span id="connection-status" role="status" aria-live="polite"></span></footer>
  </main>
  <dialog id="editor" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
